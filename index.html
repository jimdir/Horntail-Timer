<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龍王計時器</title>
    <style>
        body {
            background-color: #333;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 600px;
            margin: 0 auto;
        }

        button {
            width: 100%;
            height: 100%;
            font-size: 20px;
            padding: 20px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:disabled {
            background-color: #888;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background-color: #777;
        }

        .button-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>龍王計時器</h1>
    <div class="container">
        <div class="button-wrapper">
            <button id="timer4">Dark wyverns<br>44秒</button>
        </div>
        <div class="button-wrapper">
            <button id="timer5">Dark wyverns<br>44秒</button>
        </div>
        <div class="button-wrapper">
            <button id="timer6">Dark wyverns<br>44秒</button>
        </div>
        <div class="button-wrapper">
            <button id="timer7">DP左手60%<br>300秒</button>
        </div>
        <div class="button-wrapper">
            <button id="timer8">DP中頭60%<br>300秒</button>
        </div>
        <div class="button-wrapper">
            <button id="timer9">任務9<br>6秒</button>
        </div>
        <div class="button-wrapper">
            <button id="timer10">DP左手30%<br>180秒</button>
        </div>
        <div class="button-wrapper">
            <button id="timer11">DP中頭30%<br>180秒</button>
        </div>
        <div class="button-wrapper">
            <button id="timer12">RIP<br>570秒</button>
        </div>
    </div>
<script>
    /////////////// 鳴聲器指令 ///////////////
    function playBeep(frequency, duration = 200, volume = 0.1) {
        try {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.type = "square";
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
            gainNode.gain.setValueAtTime(volume, audioContext.currentTime);

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.start();
            setTimeout(() => {
                oscillator.stop();
                audioContext.close();
            }, duration);
        } catch (e) {
            console.warn("您的瀏覽器不支援 AudioContext。");
        }
    }

    /////////////// 時間格式化函式 ///////////////
    function formatTime(seconds) {
        if (seconds > 60) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes} : ${remainingSeconds.toString().padStart(2, '0')}`;
        }
        return `${seconds.toFixed(1)}`;
    }

    /////////////// 主運行函式 ///////////////
    function startTimer(button, duration, isLooping = false) {
        let timeLeft = duration;
        const originalText = button.innerHTML;
        button.disabled = true;
        button.style.backgroundColor = '#888';

        const timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                if (!isLooping) playBeep(300);
                button.innerHTML = originalText;
                button.disabled = false;
                button.style.backgroundColor = '#444';
                if (isLooping) {
                    playBeep(500);
                    startTimer(button, duration, true);
                }
            } else {
                if (timeLeft <= 3 && timeLeft > 2.9 && !isLooping) {
                    playBeep(200);
                    button.style.backgroundColor = 'red';
                }
                // 更新顯示的時間
                button.innerHTML = `${originalText.split('<br>')[0]}<br>${formatTime(timeLeft)}`;
            }
        }, 100);
    }

    /////////////// 初始化計時器 ///////////////
    document.addEventListener('DOMContentLoaded', () => {
        const timers = [
            { id: 'timer4', duration: 44 },
            { id: 'timer5', duration: 44 },
            { id: 'timer6', duration: 44 },
            { id: 'timer7', duration: 300 },
            { id: 'timer8', duration: 300 },
            { id: 'timer9', duration: 6 },
            { id: 'timer10', duration: 180 },
            { id: 'timer11', duration: 180 },
            { id: 'timer12', duration: 570 },
        ];

        timers.forEach(({ id, duration }) => {
            const button = document.getElementById(id);
            if (button) {
                button.addEventListener('click', () => startTimer(button, duration));
            }
        });
    });
</script>

</body>
</html>
